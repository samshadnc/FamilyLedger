<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0a65"/>
      <stop offset="100%" stop-color="#0e001f"/>
    </linearGradient>
    <clipPath id="cs">
      <circle cx="152" cy="252" r="130"/>
    </clipPath>
    <clipPath id="ch">
      <circle cx="360" cy="252" r="130"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>

  <!-- Samshad avatar (left) -->
  <image href="/samshad.png" x="22" y="122" width="260" height="260" clip-path="url(#cs)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Sahla avatar (right) -->
  <image href="/sahla.png" x="230" y="122" width="260" height="260" clip-path="url(#ch)" preserveAspectRatio="xMidYMid slice"/>

  <!-- Dark separator ring borders -->
  <circle cx="152" cy="252" r="131" fill="none" stroke="#0e001f" stroke-width="3"/>
  <circle cx="360" cy="252" r="131" fill="none" stroke="#0e001f" stroke-width="3"/>
</svg>
